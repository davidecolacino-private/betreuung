<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kinderbetreuung</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#e4e0d8;
  --accent:#2f6f5e; --accent-ink:#ffffff; --warn:#b4472f; --soft:#e9f2ee; --soft-warn:#f8e9e4; --soft-info:#efece4;
  --t1:#e3f0ea; --t2:#fdeedd; --t3:#e6eefb; --t4:#fbe4e4; --t5:#f1e8f8; --t6:#fff5cf; --t7:#e2f4f6; --t8:#ece9e3; --t9:#f9e6f0;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1e2125; --ink:#eceef0; --muted:#9aa0a6; --line:#2e3238;
    --accent:#6fc1a8; --accent-ink:#0f1a16; --warn:#f08a70; --soft:#1f3029; --soft-warn:#3a2620; --soft-info:#26292d;
    --t1:#1f3029; --t2:#3a2d1e; --t3:#1f2a3d; --t4:#3a2222; --t5:#2d2338; --t6:#36311a; --t7:#1b3235; --t8:#2a2826; --t9:#36222d;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1e2125; --ink:#eceef0; --muted:#9aa0a6; --line:#2e3238;
  --accent:#6fc1a8; --accent-ink:#0f1a16; --warn:#f08a70; --soft:#1f3029; --soft-warn:#3a2620; --soft-info:#26292d;
  --t1:#1f3029; --t2:#3a2d1e; --t3:#1f2a3d; --t4:#3a2222; --t5:#2d2338; --t6:#36311a; --t7:#1b3235; --t8:#2a2826; --t9:#36222d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.6rem;margin:4px 0 2px;line-height:1.2}
h2{font-size:1.15rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.small{padding:6px 10px;font-size:.9rem}
button.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:160px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small-text{font-size:.9rem}

/* Startseite */
.hero{border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,var(--t1),var(--t3));padding:22px 18px;margin-bottom:12px;position:relative}
.hero.has-img{padding:0;background:var(--card);border:1px solid var(--line)}
.hero img{display:block;width:100%;max-height:260px;object-fit:cover}
.hero .hero-text{padding:14px 18px}
.hero .emoji{font-size:2.4rem;line-height:1}
.next{display:flex;gap:14px;align-items:center;background:var(--soft);border:0;width:100%;text-align:left;color:var(--ink);border-radius:var(--radius);padding:14px 16px;margin:0 0 12px}
.next .big{font-size:1.15rem;font-weight:600}
.next .ico{font-size:1.8rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;min-height:120px}
.tile:active{transform:scale(.98)}
.tile .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.tile .lb{font-weight:600;font-size:1rem;line-height:1.2}
.tile .sb{font-size:.82rem;color:var(--muted);line-height:1.3}

/* Unterseiten */
.back{background:transparent;color:var(--accent);padding:6px 0;font-weight:600}
.page-title{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.page-title .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem}

/* Monate */
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
@media (min-width:560px){.months{grid-template-columns:repeat(4,1fr)}}
.mbtn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.mbtn .mn{font-weight:600}
.mbtn .mc{font-size:.8rem;color:var(--muted)}
.mbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mbtn.on .mc{color:var(--accent-ink);opacity:.85}
.mbtn.past{opacity:.6}
.day{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .when{font-weight:600}
.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.month-head h2{margin:0}
.note{background:var(--soft-info);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.92rem}
.badge{font-size:.78rem;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--accent);white-space:nowrap;align-self:center}
.badge.off{background:var(--soft-warn);color:var(--warn)}
.cancel .when,.cancel .time{text-decoration:line-through;color:var(--muted)}

.contact h3{margin:0;font-size:1.05rem}
.contact .role{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.contact a{color:var(--accent);text-decoration:none;display:inline-block;margin-right:14px}
.md h3{font-size:1.05rem;margin:14px 0 4px}
.md h3:first-child{margin-top:0}
.md ul{margin:4px 0;padding-left:20px}
.md p{margin:6px 0}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div{word-break:break-word}
.edit-item{border:1px dashed var(--line);border-radius:10px;padding:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center}
.login{width:100%;max-width:380px}
.err{color:var(--warn);font-size:.9rem;min-height:1.2em}
.ok{color:var(--accent);font-size:.9rem;min-height:1.2em}
footer{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.92rem}
.subtabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h3.grp{font-size:1rem;margin:16px 0 0}
.thumb{max-width:100%;max-height:160px;border-radius:10px;display:block;margin:8px 0}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
"use strict";
const DATA_FILE = "data.enc.json";
const ITER = 310000;
const TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const te = new TextEncoder(), td = new TextDecoder();
const app = document.getElementById("app");

let encFile = null, data = null, password = null, view = "home", editing = false, setupMode = false, editMine = false, selMonth = null, subTab = "personalien";

/* ---------- Helfer ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtDate = s => parse(s).toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long"});
const fmtDay = s => parse(s).toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"numeric"});
const fmtShort = s => parse(s).toLocaleDateString("de-CH",{day:"numeric",month:"numeric",year:"numeric"});
const minutes = (a,b) => { if(!a||!b) return 0; const [h1,m1]=a.split(":").map(Number), [h2,m2]=b.split(":").map(Number); return Math.max(0,(h2*60+m2)-(h1*60+m1)); };
const fmtHours = m => (Math.round(m/6)/10).toLocaleString("de-CH");
function toB64(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function fromB64(b){ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
const digits = n => String(n||"").replace(/[^\d+]/g,"").replace(/^00/,"+");
const todayIso = () => iso(new Date());

/* ---------- Verschlüsselung (AES-GCM, Schlüssel per PBKDF2) ---------- */
async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptData(obj, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, te.encode(JSON.stringify(obj))));
  return {v:1, iter:ITER, salt:toB64(salt), iv:toB64(iv), ct:toB64(ct)};
}
async function decryptData(file, pw){
  const key = await deriveKey(pw, fromB64(file.salt), file.iter);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:fromB64(file.iv)}, key, fromB64(file.ct));
  return JSON.parse(td.decode(pt));
}

/* ---------- Felder ---------- */
const NANNY_GROUPS = [
  {t:"Personalien", f:[{k:"name",l:"Name"},{k:"geburtsdatum",l:"Geburtsdatum"},{k:"ahv",l:"AHV-Nummer"},{k:"nationalitaet",l:"Nationalität"},{k:"sprache",l:"Sprache"}]},
  {t:"Adresse", f:[{k:"strasse",l:"Strasse"},{k:"plz_ort",l:"PLZ / Ort"},{k:"telefon",l:"Mobiltelefon"},{k:"email",l:"E-Mail"}]},
  {t:"Bankverbindung", f:[{k:"bank",l:"Bank"},{k:"iban",l:"Konto (IBAN)"}]},
  {t:"Notfallkontakt", f:[{k:"notfall_name",l:"Name"},{k:"notfall_bez",l:"Beziehung"},{k:"notfall_tel",l:"Telefon"}]},
  {t:"Weitere Anstellungen", f:[{k:"weitere",l:"Angaben"}]}
];
const NANNY_FIELDS = NANNY_GROUPS.flatMap(g=>g.f);
const DOC_COLLS = {dokumente:"Dokumente", lohnabrechnungen:"Lohnabrechnungen", lohnausweise:"Lohnausweise"};
const MELDUNG_FIELDS = [
  {k:"whatsapp",l:"WhatsApp-Nummer für Quittungen und Meldungen"},
  {k:"email",l:"E-Mail für Quittungen und Meldungen"}
];

/* ---------- Vorlage (enthält bewusst keine persönlichen Daten, da öffentlich) ---------- */
function template(){
  return {
    titel: "Kinderbetreuung", untertitel: "", start: "",
    wochenplan: [], ausnahmen: [], ferien: [], kontakte: [],
    abschnitte: [{titel:"Kinder", icon:"🧸", inhalt:"## Ablauf\n- …"}],
    nanny: {}, meldung: {}, dokumente: [], titelbild: null
  };
}
function normalize(d){
  for(const k of ["wochenplan","ausnahmen","ferien","kontakte","abschnitte","dokumente","lohnabrechnungen","lohnausweise"]) d[k] ||= [];
  d.nanny ||= {}; d.meldung ||= {};
  return d;
}

/* ---------- Einsatzplan ---------- */
function schedule(fromDate, days){
  const out = [];
  const inFerien = s => (data.ferien||[]).find(f => f.von && f.bis && s >= f.von && s <= f.bis);
  for(let i=0;i<days;i++){
    const d = new Date(fromDate); d.setDate(fromDate.getDate()+i);
    const s = iso(d);
    const ex = (data.ausnahmen||[]).filter(a => a.datum === s);
    const fer = inFerien(s);
    const beforeStart = data.start && s < data.start;
    const reg = (data.wochenplan||[]).filter(w => Number(w.tag) === d.getDay());
    for(const w of reg){
      if(beforeStart) continue;
      const ausfall = ex.find(a => a.typ === "ausfall");
      const geaendert = ex.find(a => a.typ === "geaendert");
      if(fer && !geaendert) continue;
      if(ausfall){ out.push({datum:s, von:w.von, bis:w.bis, notiz:ausfall.notiz, typ:"ausfall"}); continue; }
      if(geaendert){ out.push({datum:s, von:geaendert.von||w.von, bis:geaendert.bis||w.bis, notiz:geaendert.notiz, typ:"geaendert"}); continue; }
      out.push({datum:s, von:w.von, bis:w.bis, notiz:w.notiz, typ:"regulär"});
    }
    for(const a of ex.filter(a => a.typ === "zusatz")) out.push({datum:s, von:a.von, bis:a.bis, notiz:a.notiz, typ:"zusatz"});
  }
  return out;
}
/* Zeitraum: ab Startmonat (oder aktuellem Monat) bis Ende des Schuljahres (Juli) */
function planRange(){
  const today = new Date(); today.setHours(0,0,0,0);
  let first = new Date(today.getFullYear(), today.getMonth(), 1);
  if(data.start){ const s = parse(data.start); const sf = new Date(s.getFullYear(), s.getMonth(), 1); if(sf < first) first = sf; }
  const endYear = first.getMonth() >= 7 ? first.getFullYear()+1 : first.getFullYear();
  let end = new Date(endYear, 6, 31);
  if(end - today < 90*864e5) end = new Date(today.getFullYear(), today.getMonth()+6, 0);
  return {first, end};
}
function nextEinsatz(){
  const today = new Date(); today.setHours(0,0,0,0);
  return schedule(today, 120).find(x => x.typ !== "ausfall");
}

/* ---------- Mini-Markdown ---------- */
function md(text){
  const lines = String(text||"").split("\n");
  let html = "", inList = false;
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  for(const raw of lines){
    const l = raw.trimEnd();
    if(/^\s*[-*] /.test(l)){ if(!inList){ html+="<ul>"; inList=true; } html += "<li>"+inline(l.replace(/^\s*[-*] /,""))+"</li>"; continue; }
    if(inList){ html+="</ul>"; inList=false; }
    if(l.startsWith("## ")) html += "<h3>"+inline(l.slice(3))+"</h3>";
    else if(l.trim()) html += "<p>"+inline(l)+"</p>";
  }
  if(inList) html+="</ul>";
  return html;
}
const telLink = n => n ? `<a href="tel:${esc(digits(n))}">📞 ${esc(n)}</a>` : "";

/* ---------- Senden (Quittungen, Änderungen) ---------- */
async function sendMessage(text, file){
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text}); return "geteilt"; }
    catch(e){ if(e && e.name === "AbortError") return "abgebrochen"; }
  } else if(!file && navigator.share){
    try{ await navigator.share({text}); return "geteilt"; }
    catch(e){ if(e && e.name === "AbortError") return "abgebrochen"; }
  }
  const wa = digits(data.meldung.whatsapp).replace("+","");
  if(wa){ window.open(`https://wa.me/${wa}?text=${encodeURIComponent(text)}`, "_blank", "noopener"); return file ? "whatsapp-foto" : "whatsapp"; }
  if(data.meldung.email){ location.href = `mailto:${data.meldung.email}?subject=${encodeURIComponent(text.split("\n")[0])}&body=${encodeURIComponent(text)}`; return file ? "mail-foto" : "mail"; }
  return "keinziel";
}

/* ---------- Seitenliste ---------- */
function pages(){
  const nx = nextEinsatz();
  const list = [
    {id:"einsaetze", icon:"📅", label:"Einsätze", sub: nx ? "Nächster: "+fmtDay(nx.datum) : "Nach Monaten"},
    {id:"kontakte", icon:"📞", label:"Kontakte", sub:"Eltern, Arzt, Schule"}
  ];
  (data.abschnitte||[]).forEach((a,i)=>list.push({id:"a"+i, icon:a.icon||"📌", label:a.titel||"Abschnitt", sub:a.untertitel||""}));
  list.push({id:"quittungen", icon:"🧾", label:"Quittungen", sub:"Einkauf einreichen"});
  list.push({id:"angaben", icon:"👤", label:"Meine Daten", sub:"Personalien, Lohn, Arbeitseinsätze"});
  list.push({id:"dokumente", icon:"📁", label:"Dokumente", sub:(data.dokumente||[]).length+" Dateien"});
  return list;
}
const TINTS = ["--t1","--t2","--t3","--t4","--t5","--t6","--t7","--t8","--t9"];

/* ---------- Rendern ---------- */
function render(){
  if(editing) return renderEditor();
  if(!data) return renderLogin();
  const ps = pages();
  if(view !== "home" && !ps.find(p=>p.id===view)) view = "home";
  if(view === "home") return renderHome(ps);
  const idx = ps.findIndex(p=>p.id===view), p = ps[idx];
  let body = "";
  if(view==="einsaetze") body = viewEinsaetze();
  else if(view==="kontakte") body = viewKontakte();
  else if(view==="quittungen") body = viewQuittungen();
  else if(view==="angaben") body = viewAngaben();
  else if(view==="dokumente") body = viewDokumente();
  else { const a = data.abschnitte[Number(view.slice(1))]; body = `<div class="card md">${md(a.inhalt)}</div>`; }
  app.innerHTML = `
    <button class="back" data-view="home">← Übersicht</button>
    <h1 class="page-title"><span class="ic" style="background:var(${TINTS[idx%TINTS.length]})">${esc(p.icon)}</span>${esc(p.label)}</h1>
    ${body}
    <footer><button class="ghost small" data-view="home">← Zurück zur Übersicht</button></footer>`;
  if(view==="quittungen"){ const d = document.getElementById("qDatum"); if(d && !d.value) d.value = todayIso(); }
}

function renderHome(ps){
  const nx = nextEinsatz();
  const img = data.titelbild && data.titelbild.data;
  app.innerHTML = `
    <div class="hero ${img?"has-img":""}">
      ${img ? `<img src="data:${esc(data.titelbild.typ)};base64,${data.titelbild.data}" alt="">` : ""}
      <div class="${img?"hero-text":""}">
        ${img ? "" : '<div class="emoji">👨‍👩‍👧‍👦</div>'}
        <h1>${esc(data.titel)}</h1>
        ${data.untertitel ? `<div class="muted">${esc(data.untertitel)}</div>` : ""}
      </div>
    </div>
    ${nx ? `<button class="next" data-view="einsaetze"><span class="ico">⏰</span><span><span class="muted small-text">Nächster Einsatz</span><br><span class="big">${fmtDate(nx.datum)}</span><br>${esc(nx.von)}–${esc(nx.bis)} Uhr${nx.notiz?" · "+esc(nx.notiz):""}</span></button>` : ""}
    <div class="tiles">
      ${ps.map((p,i)=>`<button class="tile" data-view="${p.id}">
        <span class="ic" style="background:var(${TINTS[i%TINTS.length]})">${esc(p.icon)}</span>
        <span class="lb">${esc(p.label)}</span>
        ${p.sub?`<span class="sb">${esc(p.sub)}</span>`:""}
      </button>`).join("")}
    </div>
    <footer>
      <button class="ghost small" id="btnEdit">Inhalte bearbeiten (Familie)</button>
      <button class="ghost small" id="btnLogout">Abmelden</button>
    </footer>`;
}

function viewEinsaetze(){
  const {first, end} = planRange();
  const days = Math.round((end - first)/864e5) + 1;
  const all = schedule(first, days);
  const tIso = todayIso(), curKey = tIso.slice(0,7);
  const typLabel = {"regulär":"", "zusatz":"Zusatzeinsatz", "geaendert":"Geänderte Zeit", "ausfall":"Fällt aus"};

  const months = [];
  for(let m = new Date(first); m <= end; m = new Date(m.getFullYear(), m.getMonth()+1, 1)){
    const key = m.getFullYear()+"-"+pad(m.getMonth()+1);
    const items = all.filter(x => x.datum.startsWith(key));
    months.push({key, date:new Date(m), items, worked: items.filter(x=>x.typ!=="ausfall")});
  }
  if(!selMonth || !months.find(m=>m.key===selMonth)){
    const firstWithWork = months.find(m => m.key >= curKey && m.worked.length);
    selMonth = (months.find(m=>m.key===curKey && m.worked.length) || firstWithWork || months[0]).key;
  }
  const sel = months.find(m=>m.key===selMonth);
  const mEnd = iso(new Date(sel.date.getFullYear(), sel.date.getMonth()+1, 0));
  const fer = (data.ferien||[]).filter(f => f.von && f.bis && f.von <= mEnd && f.bis >= sel.key+"-01");
  const mins = sel.worked.reduce((s,x)=>s+minutes(x.von,x.bis),0);
  const plan = (data.wochenplan||[]).map(w=>`${TAGE[w.tag]} ${esc(w.von)}–${esc(w.bis)} Uhr${w.notiz?" ("+esc(w.notiz)+")":""}`).join("<br>");

  return `

function openDoc(ref){
  const [coll, i] = String(ref).split(":");
  const d = data[coll][Number(i)];
  const blob = new Blob([fromB64(d.data)], {type:d.typ||"application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  if(!(d.typ==="application/pdf" || (d.typ||"").startsWith("image/"))) a.download = d.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

async function doExport(){
  const err = document.getElementById("exErr");
  const p1 = document.getElementById("pw1").value, p2 = document.getElementById("pw2").value;
  let pw = password;
  if(p1 || setupMode){
    if(p1.length < 12){ err.textContent = "Das Passwort muss mindestens 12 Zeichen haben."; return; }
    if(p1 !== p2){ err.textContent = "Die Passwörter stimmen nicht überein."; return; }
    pw = p1;
  }
  err.textContent = "Wird verschlüsselt …";
  const file = await encryptData(data, pw);
  const blob = new Blob([JSON.stringify(file)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = DATA_FILE;
  document.body.appendChild(a); a.click(); a.remove();
  password = pw; encFile = file; setupMode = false;
  if(lsGet("np_pw")) lsSet("np_pw", pw);
  err.style.color = "var(--accent)";
  err.textContent = `Die Datei ${DATA_FILE} wurde heruntergeladen. Lade sie jetzt auf GitHub hoch und ersetze die bisherige Datei (Name muss exakt ${DATA_FILE} lauten).`;
}

/* Titelbild verkleinern, damit die Seite schnell lädt */
function shrinkImage(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1400, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve({typ:"image/jpeg", data:c.toDataURL("image/jpeg", 0.82).split(",")[1]});
      };
      img.onerror = reject;
      img.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

app.addEventListener("change", async e => {
  if(e.target.id === "imgIn"){
    const f = e.target.files[0]; if(!f) return;
    try{ data.titelbild = await shrinkImage(f); }catch(err){ alert("Das Bild konnte nicht gelesen werden."); }
    render(); return;
  }
  const coll = e.target.dataset.upload;
  if(!coll) return;
  const files = [...e.target.files];
  let pending = files.length;
  for(const f of files){
    if(f.size > 15*1024*1024){ alert(f.name+" ist grösser als 15 MB."); if(--pending===0) render(); continue; }
    const r = new FileReader();
    r.onload = () => { data[coll].push({name:f.name.replace(/\.[^.]+$/,""), typ:f.type, data:String(r.result).split(",")[1]}); if(--pending===0) render(); };
    r.readAsDataURL(f);
  }
});
app.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id;
  if(id === "loginForm"){
    tryLogin(document.getElementById("pw").value, document.getElementById("remember").checked);
  }
  else if(id === "qForm"){
    const datum = document.getElementById("qDatum").value;
    const betrag = Number(document.getElementById("qBetrag").value || 0);
    const zweck = document.getElementById("qZweck").value.trim();
    const file = document.getElementById("qFoto").files[0] || null;
    const msg = document.getElementById("qMsg");
    const text = `Quittung ${fmtShort(datum)}\nCHF ${betrag.toFixed(2)} – ${zweck}\n(${data.nanny.name||"Nanny"})`;
    const res = await sendMessage(text, file);
    if(res === "abgebrochen"){ msg.textContent = ""; return; }
    if(res === "keinziel"){ msg.className = "err"; msg.textContent = "Kein Empfänger hinterlegt – bitte der Familie melden."; return; }
    const hist = qHistory(); hist.push({datum, betrag, zweck}); lsSet("np_q", JSON.stringify(hist.slice(-100)));
    render();
    const m2 = document.getElementById("qMsg");
    if(m2) m2.textContent = (res==="whatsapp-foto"||res==="mail-foto") ? "Text vorbereitet – bitte das Foto im Chat bzw. in der E-Mail noch anhängen." : "Gesendet. Danke!";
  }
  else if(id === "mineForm"){
    const changes = [];
    let bemerkung = "";
    e.target.querySelectorAll("[data-mine]").forEach(el => {
      const k = el.dataset.mine, v = el.value.trim();
      if(k === "_bemerkung"){ bemerkung = v; return; }
      if(v !== String(data.nanny[k]||"").trim()){
        const f = NANNY_FIELDS.find(x=>x.k===k);
        changes.push(`${f.l}: ${v||"(leer)"}`);
      }
    });
    const msg = document.getElementById("mineMsg");
    if(!changes.length && !bemerkung){ msg.className = "err"; msg.textContent = "Es wurde nichts geändert."; return; }
    const text = `Änderung meiner Angaben (${data.nanny.name||"Nanny"})\n` + changes.join("\n") + (bemerkung ? `\nBemerkung: ${bemerkung}` : "");
    const res = await sendMessage(text, null);
    if(res === "abgebrochen") return;
    if(res === "keinziel"){ msg.className = "err"; msg.textContent = "Kein Empfänger hinterlegt – bitte der Familie direkt melden."; return; }
    msg.className = "ok"; msg.textContent = "Gesendet. Wir passen die Angaben an – danke!";
  }
});

  try{
    const r = await fetch(DATA_FILE, {cache:"no-store"});
    if(r.ok) encFile = await r.json();
  }catch(e){ encFile = null; }
  render();
  const saved = lsGet("np_pw");
  if(encFile && saved) tryLogin(saved, true);
})();
</script>
